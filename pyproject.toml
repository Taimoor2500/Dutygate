[project]
name = "dutygate"
version = "0.1.0"
description = "DutyGate: a chatbot-agnostic gate that flags legal and compliance triggers in inbound messages before the bot replies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Taimoor Rashid" }]
keywords = ["chatbot", "compliance", "legal", "guardrail", "typesafe", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20"]
langchain = ["langchain-core>=0.3"]

[project.scripts]
dutygate = "dutygate.cli:main"

[project.urls]
Homepage = "https://github.com/Taimoor2500/Dutygate"
Documentation = "https://github.com/Taimoor2500/Dutygate#readme"
Issues = "https://github.com/Taimoor2500/Dutygate/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6",
    "flask>=3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dutygate"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "dutygate/packs"
"evals/legal-triggers/dataset.jsonl" = "dutygate/evals/legal-triggers/dataset.jsonl"
"evals/legal-triggers/keywords.yaml" = "dutygate/evals/legal-triggers/keywords.yaml"
"evals/outbound-claims/dataset.jsonl" = "dutygate/evals/outbound-claims/dataset.jsonl"
"evals/outbound-claims/keywords.yaml" = "dutygate/evals/outbound-claims/keywords.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/packs",
    "/tests",
    "/conformance",
    "/evals",
    "/README.md",
    "/SPEC.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real TypeSafe API (needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live' -q"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["dutygate"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "uvicorn.*"]
ignore_missing_imports = true
