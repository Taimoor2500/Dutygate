name: Feature or pack request
description: A new category, adapter, language, or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For new categories, include synthetic example messages (positive and near-miss).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
